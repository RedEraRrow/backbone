[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backbone"
version = "0.1.0"
description = "Shared graphical/processing backbone for the back* suite (backtrack, backcrack, ...) - colors, margins, box-drawing, meters: one visual language, implemented once."
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["backbone"]
